name: Build Local Ride Driver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK and Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_DIR"
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          mkdir -p "$SDK_DIR/licenses"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists for CI builds
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-Ride-Driver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
